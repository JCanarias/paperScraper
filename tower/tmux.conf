# Scroll back with the mouse wheel; to select text for copying, hold Shift.
set -g mouse on
set -g history-limit 50000
# No status bar: the page looks like a plain terminal.
set -g status off
set -g default-terminal "screen-256color"
# No prefix key: from the browser only the menu can be used, not tmux's commands (new windows, a shell...).
set -g prefix None
set -g prefix2 None
